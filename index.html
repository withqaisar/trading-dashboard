    <script>
    /* ================================================================
       VPS FIREWALL FIX v2 (auto-added)
       The Exness VPS blocks api.binance.com (signal engine data).
       Retry once via Binance's own public mirror data-api.binance.vision
       (same data, no key needed). On your home PC nothing changes.
       ================================================================ */
    (function () {
      var of = window.fetch.bind(window);
      window.fetch = function (u, o) {
        var url = (typeof u === 'string') ? u : (u && u.url) || '';
        if (url.indexOf('https://api.binance.com') !== 0) {
          return of(u, o);
        }
        var alt = url.replace('https://api.binance.com', 'https://data-api.binance.vision');
        function viaMirror() { return of(alt, o); }
        try {
          return of(u, o).then(function (res) {
            return (res && res.ok) ? res : viaMirror();
          }, function () { return viaMirror(); });
        } catch (e) { return viaMirror(); }
      };
    })();
    </script>

  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script>
    /* ================================================================
       AI BOT BRIDGE v3 (auto-added)
       1) SIGNAL sync (every 30s): master signal + indicator values
       2) NEWSFEED sync (every 60s): economic calendar + war/econ news
       Requirement: the bot must be running, and this page must stay
       open in a browser tab on the SAME computer (the VPS).
       ================================================================ */
    (function () {
      function findVal(label) {
        var els = document.querySelectorAll('div,span,p,td,h1,h2,h3,h4,h5,h6,button');
        var lab = null;
        for (var i = 0; i < els.length; i++) {
          if (els[i].textContent.trim().toLowerCase() === label) { lab = els[i]; break; }
        }
        if (!lab) return null;
        var box = lab.parentElement;
        for (var up = 0; up < 5 && box; up++, box = box.parentElement) {
          var cand = box.querySelectorAll('*');
          for (var j = 0; j < cand.length; j++) {
            var e = cand[j];
            if (e === lab || e.contains(lab)) continue;
            var t = e.textContent.trim();
            if (/^[+-]?\d+(\.\d+)?$/.test(t)) return parseFloat(t);
          }
        }
        return null;
      }
      function hasText(t) {
        try { return document.body.innerText.toUpperCase().indexOf(t) !== -1; } catch (e) { return false; }
      }
      function findTxt(label) {
        var els = document.querySelectorAll('div,span,p,td,h1,h2,h3,h4,h5,h6,button');
        var lab = null;
        for (var i = 0; i < els.length; i++) {
          if (els[i].textContent.trim().toLowerCase() === label) { lab = els[i]; break; }
        }
        if (!lab) return null;
        var box = lab.parentElement;
        for (var up = 0; up < 5 && box; up++, box = box.parentElement) {
          var cand = box.querySelectorAll('*');
          for (var j = 0; j < cand.length; j++) {
            var e = cand[j];
            if (e === lab || e.contains(lab)) continue;
            var t = e.textContent.trim();
            if (t && t.length >= 2 && t.length <= 40 && e.children.length === 0
                && t.toLowerCase() !== label) return t;
          }
        }
        return null;
      }
      function findPct(word) {
        try {
          var all = document.querySelectorAll('*');
          for (var i = 0; i < all.length; i++) {
            var e = all[i];
            if (e.children.length) continue;
            var t = e.textContent.trim();
            var m = t.match(/([+-]?\d+(\.\d+)?)\s*%/);
            if (!m) continue;
            var box = e;
            for (var up = 0; up < 4 && box; up++, box = box.parentElement) {
              if (box.textContent.toLowerCase().indexOf(word) !== -1) return parseFloat(m[1]);
            }
          }
        } catch (e2) {}
        return null;
      }
      function detectSymbol() {
        try {
          var els = document.querySelectorAll('[class*="active"], [aria-selected="true"], [data-state="active"]');
          for (var i = 0; i < els.length; i++) {
            var t = (els[i].textContent || '').toUpperCase();
            if (t.length < 60) {
              if (t.indexOf('BTC') !== -1) return 'BTCUSD';
              if (t.indexOf('XAU') !== -1 || t.indexOf('GOLD') !== -1) return 'XAUUSD';
            }
          }
        } catch (e) {}
        return 'XAUUSD';
      }
      function send() {
        try {
          var sym = detectSymbol();
          var port = (sym === 'BTCUSD') ? 8788 : 8787;
          var payload = {
            symbol: sym,
            avg: findVal('indicator average'),
            btc_change: findPct('btc'),
            conflict: hasText('ACTIVE CONFLICT'),
            btc_divergence: hasText('DIVERGENCE RISK'),
            ai_confidence: findVal('confidence'),
            ai_predicted: findTxt('predicted'),
            genius_best: findTxt('best pattern'),
            indicators: {
              smart_money: findVal('smart money'),
              smc_structure: findVal('smc structure'),
              htf_confluence: findVal('htf confluence'),
              macro: findVal('macro'),
              grid_25: findVal('25-ind grid'),
              session: findVal('session')
            },
            time: new Date().toISOString()
          };
          [8787, 8788].forEach(function (pt) {
            fetch('http://localhost:' + pt + '/signal', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }).catch(function () {});
          });
        } catch (e) {}
      }
      setInterval(send, 30000);
      setTimeout(send, 5000);

      /* ---------- v2: economic calendar + war/econ news sync ---------- */
      function findPanelList(headingText) {
        // primary: code-path tag; fallback: heading text -> panel -> scrollable list
        var els = document.querySelectorAll('[code-path*="EconomicCalendar.tsx"]');
        var i;
        for (i = 0; i < els.length; i++) {
          var cls = els[i].className || '';
          if (typeof cls === 'string' && cls.indexOf('overflow-y-auto') !== -1) return els[i];
        }
        var hs = document.querySelectorAll('h1,h2,h3,h4,span,div');
        for (i = 0; i < hs.length; i++) {
          if ((hs[i].textContent || '').trim() === headingText) {
            var box = hs[i];
            for (var up = 0; up < 6 && box; up++, box = box.parentElement) {
              var ov = box.querySelector('div[class*="overflow-y-auto"]');
              if (ov) return ov;
            }
          }
        }
        return null;
      }
      function scrapeCalendar() {
        var list = findPanelList('Economic Calendar');
        if (!list) return [];
        var rows = list.children, out = [];
        for (var r = 0; r < rows.length && out.length < 25; r++) {
          var lines = (rows[r].innerText || '').split('\n');
          var ev = { time: '', title: '', meta: '', prediction: '', countdown: '' };
          for (var k = 0; k < lines.length; k++) {
            var t = lines[k].trim();
            if (!t) continue;
            if (!ev.time && /^\d{1,2}:\d{2}$/.test(t)) { ev.time = t; continue; }
            if (!ev.meta && t.indexOf('\u00B7') !== -1) { ev.meta = t; continue; }
            if (!ev.prediction && /^(BUY|SELL|WATCH|VOLATILE)$/i.test(t)) { ev.prediction = t.toUpperCase(); continue; }
            if (!ev.countdown && (/^\d+h\s*\d+m$/i.test(t) || /^\d+\s*m$/i.test(t) || /^live/i.test(t))) { ev.countdown = t; continue; }
            if (!ev.title && t.length > 3 && t.length < 90) { ev.title = t; }
          }
          if (ev.title) out.push(ev);
        }
        return out;
      }
      function scrapeNews() {
        var links = document.querySelectorAll('a[code-path*="WarNewsFeed.tsx"]');
        if (!links.length) {
          // fallback: external links inside the monitor panel
          var hs = document.querySelectorAll('h1,h2,h3,h4,span,div');
          for (var i = 0; i < hs.length; i++) {
            if ((hs[i].textContent || '').trim().indexOf('EconData Monitor') !== -1
                && (hs[i].textContent || '').trim().length < 50) {
              var box = hs[i];
              for (var up = 0; up < 6 && box; up++, box = box.parentElement) {
                var found = box.querySelectorAll('a[href^="http"]');
                if (found.length) { links = found; break; }
              }
              break;
            }
          }
        }
        var out = [];
        for (var i = 0; i < links.length && out.length < 20; i++) {
          var a = links[i];
          var p = a.querySelector('p');
          var title = p ? (p.textContent || '').trim() : (a.textContent || '').trim().split('\n')[0].trim();
          if (!title || title.length < 15) continue;
          var lines = (a.innerText || '').split('\n');
          var meta = [];
          for (var k = 0; k < lines.length; k++) {
            var t = lines[k].trim();
            if (t && t !== title) meta.push(t);
          }
          out.push({ title: title, link: a.href || '', meta: meta.join(' \u00B7 ').slice(0, 140) });
        }
        return out;
      }
      function sendFeed() {
        try {
          var payload = {
            calendar: scrapeCalendar(),
            news: scrapeNews(),
            time: new Date().toISOString()
          };
          var body = JSON.stringify(payload);
          [8787, 8788].forEach(function (pt) {
            fetch('http://localhost:' + pt + '/newsfeed', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: body
            }).catch(function () {});
          });
        } catch (e) {}
      }
      setInterval(sendFeed, 60000);
      setTimeout(sendFeed, 12000);
    })();
    </script>
